<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2023 May Mammoth Cave RV Trip Travel Review - WebPPT Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e12;
            font-family: 'Outfit', sans-serif;
        }
        #presentation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            background: #000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .slide-asset {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .active {
            display: block;
        }
        #slide-video {
            z-index: 20;
            background: transparent;
        }
        .hud-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 40px;
            color: #f3f4f6;
            display: flex;
            gap: 24px;
            align-items: center;
            opacity: 0.15;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .hud-overlay:hover {
            opacity: 1;
            transform: translateX(-50%) scale(1.02);
        }
        .btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn:active {
            transform: scale(0.9);
        }
        #slide-counter {
            font-size: 15px;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .home-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .home-btn:hover {
            opacity: 1;
            transform: translateY(-2px);
        }
        .skip-video-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(124, 58, 237, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: opacity 0.3s, transform 0.2s, background 0.2s;
        }
        .skip-video-btn:hover, .skip-video-btn:active {
            background: rgba(139, 92, 246, 0.95);
            transform: translateY(-2px);
        }
        .skip-video-btn.active {
            display: inline-flex;
        }
        @media (hover: none) and (pointer: coarse) {
            .hud-overlay {
                opacity: 0.85;
                bottom: 20px;
                padding: 10px 20px;
                gap: 20px;
            }
            .btn {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .home-btn {
                opacity: 0.85;
                padding: 10px 16px;
            }
            .skip-video-btn {
                opacity: 0.95;
            }
        }
    </style>
</head>
<body>

<a href="../index.html" class="home-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Dashboard
</a>

<button id="skip-video-btn" class="skip-video-btn" onclick="advanceSequence(1); event.stopPropagation();">
    Next Slide
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div id="presentation-container">
    <div id="viewport" onclick="handleScreenClick(event)">
        <img id="slide-image" class="slide-asset active" src="" alt="Slide View">
        <video id="slide-video" class="slide-asset" playsinline webkit-playsinline controls></video>
    </div>

    <div class="hud-overlay">
        <button class="btn" onclick="advanceSequence(-1); event.stopPropagation();" aria-label="Previous Slide">◀</button>
        <div id="slide-counter">1 / 7</div>
        <button class="btn" onclick="advanceSequence(1); event.stopPropagation();" aria-label="Next Slide">▶</button>
    </div>
</div>

<script>
    let currentSlide = 1;
    let isVideoPlaying = false;
    let currentVideoIndex = -1; // -1 means showing still slide image
    let ignoreClicksUntil = 0;
    const totalSlides = 7;
    const videoMap = {
        "6": "media1.mp4"
};
    const slideFiles = ["Slide1.JPG", "Slide2.JPG", "Slide3.JPG", "Slide4.JPG", "Slide5.JPG", "Slide6.JPG", "Slide7.JPG"];

    const imgElement = document.getElementById('slide-image');
    const videoElement = document.getElementById('slide-video');
    const counterElement = document.getElementById('slide-counter');
    const skipBtn = document.getElementById('skip-video-btn');

    function renderSlide() {
        if (counterElement) {
            counterElement.innerText = currentSlide + " / " + totalSlides;
        }
        
        if (imgElement && slideFiles[currentSlide - 1]) {
            imgElement.src = slideFiles[currentSlide - 1];
        }
        
        if (videoElement) {
            videoElement.pause();
            videoElement.classList.remove('active');
            videoElement.src = "";
        }
        if (skipBtn) {
            skipBtn.classList.remove('active');
        }
        isVideoPlaying = false;
        currentVideoIndex = -1;
    }

    function playNextVideo() {
        let videos = videoMap[currentSlide];
        if (!videos) return false;
        if (typeof videos === 'string') {
            videos = [videos];
        }
        if (videos && videos.length > 0) {
            currentVideoIndex++;
            if (currentVideoIndex < videos.length) {
                isVideoPlaying = true;
                videoElement.src = videos[currentVideoIndex];
                videoElement.classList.add('active');
                if (skipBtn) {
                    skipBtn.classList.add('active');
                }
                videoElement.load();
                videoElement.play().catch(err => {
                    console.log("Playback error or blocked:", err);
                    isVideoPlaying = false;
                    if (skipBtn) skipBtn.classList.remove('active');
                });
                return true;
            }
        }
        return false;
    }

    function advanceSequence(direction) {
        if (direction === 1) {
            if (videoElement) {
                videoElement.pause();
                videoElement.classList.remove('active');
                videoElement.src = "";
            }
            if (skipBtn) {
                skipBtn.classList.remove('active');
            }
            isVideoPlaying = false;

            if (playNextVideo()) {
                return;
            }
            currentSlide++;
        } else {
            if (videoElement) {
                videoElement.pause();
                videoElement.classList.remove('active');
                videoElement.src = "";
            }
            if (skipBtn) {
                skipBtn.classList.remove('active');
            }
            isVideoPlaying = false;
            currentSlide--;
        }
        
        if (currentSlide < 1) currentSlide = 1;
        if (currentSlide > totalSlides) currentSlide = totalSlides;
        renderSlide();
    }

    // When video ends naturally, return to still slide and hide video overlay
    videoElement.addEventListener('ended', function() {
        let videos = videoMap[currentSlide];
        if (typeof videos === 'string') {
            videos = [videos];
        }
        if (videos && currentVideoIndex + 1 < videos.length) {
            advanceSequence(1);
        } else {
            videoElement.pause();
            videoElement.classList.remove('active');
            if (skipBtn) {
                skipBtn.classList.remove('active');
            }
            isVideoPlaying = false;
        }
    });

    // Absorb ghost clicks emitted when exiting native iOS fullscreen video player
    function handleFullscreenExit() {
        ignoreClicksUntil = Date.now() + 800;
    }
    videoElement.addEventListener('webkitendfullscreen', handleFullscreenExit);
    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement) {
            handleFullscreenExit();
        }
    });

    function handleScreenClick(event) {
        if (Date.now() < ignoreClicksUntil) {
            event.stopPropagation();
            event.preventDefault();
            return;
        }
        if (event.target.closest('.hud-overlay') || event.target.closest('.home-btn') || event.target.closest('button')) {
            return;
        }
        const width = window.innerWidth;
        if (event.clientX < width / 4) {
            advanceSequence(-1);
        } else {
            advanceSequence(1);
        }
    }

    // Swipe gesture support for iPhone / mobile navigation
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }
    }, { passive: true });

    window.addEventListener('touchend', function(e) {
        if (Date.now() < ignoreClicksUntil) return;
        if (e.changedTouches && e.changedTouches.length === 1) {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            const duration = Date.now() - touchStartTime;

            if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && duration < 600) {
                if (e.target.closest('.hud-overlay') || e.target.closest('.home-btn') || e.target.closest('button')) {
                    return;
                }
                if (deltaX < 0) {
                    advanceSequence(1);
                } else {
                    advanceSequence(-1);
                }
            }
        }
    }, { passive: true });

    window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            advanceSequence(1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
            advanceSequence(-1);
        }
    });

    window.onload = renderSlide;
</script>

</body>
</html>
